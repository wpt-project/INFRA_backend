name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

# NOTE: this workflow enforces "lint + typecheck on every PR" from §5.
# It does NOT enforce "main always deployable / PR review required" —
# that half of §5 is a GitHub *repo setting* (Settings > Branches > branch
# protection rule on `main`: require PR before merge, require this status
# check, disallow direct pushes). No workflow file can set that; whoever
# owns the GitHub org needs to turn it on once the repo exists.
